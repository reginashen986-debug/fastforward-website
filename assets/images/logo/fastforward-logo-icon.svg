<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <!-- Brand gradient: blue → orange -->
    <linearGradient id="iconBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <!-- Dark background gradient -->
    <linearGradient id="iconDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="iconGlowSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ring glow -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================================================ -->
  <!-- LIGHT VERSION                                   -->
  <!-- ================================================ -->
  <g id="icon-light">
    <!-- Outer decorative ring -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#iconBrandGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Main pill background -->
    <rect x="10" y="10" width="60" height="60" rx="16" fill="url(#iconBrandGrad)"/>

    <!-- Subtle inner highlight -->
    <rect x="11" y="11" width="58" height="20" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>

    <!-- Arrow 1 (front, full opacity) -->
    <polygon points="28,22 28,58 50,40" fill="#FFFFFF"/>

    <!-- Arrow 2 (back, slightly behind) -->
    <polygon points="38,22 38,58 60,40" fill="#FFFFFF" fill-opacity="0.75"/>

    <!-- Speed accent lines -->
    <line x1="16" y1="40" x2="23" y2="40" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="33" x2="21" y2="33" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="16" y1="47" x2="21" y2="47" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Spark dot -->
    <circle cx="60" cy="16" r="4" fill="#FFD700"/>
    <circle cx="60" cy="16" r="2" fill="#FFFFFF"/>
  </g>

  <!-- ================================================ -->
  <!-- DARK VERSION                                    -->
  <!-- ================================================ -->
  <g id="icon-dark" display="none">
    <!-- Outer decorative ring -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#iconBrandGrad)" stroke-width="1.5" stroke-opacity="0.6" filter="url(#ringGlow)"/>

    <!-- Dark background pill -->
    <rect x="10" y="10" width="60" height="60" rx="16" fill="url(#iconDarkGrad)"/>

    <!-- Gradient stroke -->
    <rect x="10" y="10" width="60" height="60" rx="16" fill="none" stroke="url(#iconBrandGrad)" stroke-width="1.5"/>

    <!-- Arrow 1 -->
    <polygon points="28,22 28,58 50,40" fill="#FFFFFF"/>

    <!-- Arrow 2 -->
    <polygon points="38,22 38,58 60,40" fill="#FFFFFF" fill-opacity="0.75"/>

    <!-- Speed accent lines -->
    <line x1="16" y1="40" x2="23" y2="40" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="33" x2="21" y2="33" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    <line x1="16" y1="47" x2="21" y2="47" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Spark dot -->
    <circle cx="60" cy="16" r="4" fill="#FFD700"/>
    <circle cx="60" cy="16" r="2" fill="#FFFFFF"/>
  </g>
</svg>
